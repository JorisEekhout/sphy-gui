            components:
              - name: "variable"
                label: "Precipitation Variable Name in NetCDF"
                type: "text_input"
                default: "precipitation"
                
              - name: "interpolation_method"
                label: "Interpolation Method"
                type: "selection"
                options: ["linear", "cubic", "nearest"]
