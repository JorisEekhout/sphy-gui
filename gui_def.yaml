          default: false
        
        - name: "changeBD"
          section: "CONSERVATION"
          label: "Relative Change in Bulk Density (%)"
          depends_on: "changeBDFLAG"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "conservation/change_bd.map"

      - name: conservation_vegetation_cover
        type: group_box
        label: Vegetation Cover
        help_id: help_conservation_vegetation_cover
        depends_on: 
          - "ConservationFLAG"
        parameters:
        - name: "vegetationCoverFLAG"
          section: "CONSERVATION"
          label: "Enable Vegetation Cover"
