        type: group_box
        label: Irrigation Module
        parameters:
        - name: "IrrigationFLAG"
          section: "IRRIGATION"
          label: "Enable Irrigation Module"
          type: "flag"
          default: false

      - name: irrigation_parameters
        type: group_box
        label: Irrigation Parameters
        depends_on: "IrrigationFLAG"
        parameters:
        - name: "IrrigationTable"
          section: "IRRIGATION"
          label: "Irrigation Table"
          type: "file_input"
          path_style: "relative"
          extension: "*.tbl"
          default: "landuse/irrigation.tbl"

  erosion:
    label: "Erosion"
    parameters:
      - name: erosion_module
        type: group_box
        label: Erosion Module
        parameters:
        - name: "ErosionFLAG"
          section: "MODULES"
          label: "Enable Erosion Module"
          type: "flag"
          default: false

      - name: erosion_parameters
        type: group_box
        label: Erosion Parameters
        help_id: help_erosion
        parameters:
        - name: "ErosionModel"
          section: "EROSION"
          label: "Select Soil Erosion Model"
          type: "selection"
          options:
          - label: "Morgan-Morgan-Finney (MMF)"
            value: 2
          - label: "MUSLE"
            value: 1
          depends_on: "ErosionFLAG"
          default: 2
  
        - name: "RockFrac"
          section: "EROSION"
          label: "Rock Fraction (-)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          depends_on: "ErosionFLAG"
          default: "rock_fraction.map"

        - name: "RoutedRunoffFLAG"
          section: "EROSION"
          label: "Enable Routed Runoff as Input"
          depends_on: 
            - "ErosionFLAG"
            - "RoutFLAG"
          type: "flag"
          default: false

        - name: "exclChannelsFLAG"
          section: "EROSION"
          label: "Exclude Channels in Erosion Calculation"
          depends_on: 
            - "ErosionFLAG"
            - "RoutFLAG"
            - "RoutedRunoffFLAG"
          type: "flag"
          default: false

        - name: "upstream_km2_erosion"
          section: "EROSION"
          label: "Upstream Area for Definition of Channels (km<sup>2</sup>)"
          type: "scalar"
          depends_on: 
            - "ErosionFLAG"
            - "RoutFLAG"
            - "RoutedRunoffFLAG"
          default: 25

      - name: erosion_mmf
        type: group_box
        label: Morgan-Morgan-Finney (MMF)
        help_id: help_mmf
        parameters:
        - name: "MMF_table"
          section: "MMF"
          label: "MMF Table"
          type: "file_input"
          path_style: "relative"
          extension: "*.tbl"
          depends_on: "ErosionFLAG"
          default: "landuse/mmf.tbl"

        - name: "harvestFLAG"
          section: "MMF"
          label: "Enable Erosion After Harvest"
          depends_on: "ErosionFLAG"
          type: "flag"
          default: false

        - name: "MMF_harvest"
          section: "MMF"
          label: "MMF Harvest Table"
          type: "file_input"
          path_style: "relative"
          extension: "*.tbl"
          depends_on: 
            - "ErosionFLAG"
            - "harvestFLAG"
          default: "landuse/mmf_harvest.tbl"

        - name: "K_c"
          section: "MMF"
          label: "Detachability of Clay by Raindrop Impact (g mm<sup>-1</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 0.1

        - name: "K_z"
          section: "MMF"
          label: "Detachability of Silt by Raindrop Impact (g mm<sup>-1</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 0.5

        - name: "K_s"
          section: "MMF"
          label: "Detachability of Sand by Raindrop Impact (g mm<sup>-1</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 0.3

        - name: "DR_c"
          section: "MMF"
          label: "Detachability of Clay by Runoff (g mm<sup>-1</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 1.0

        - name: "DR_z"
          section: "MMF"
          label: "Detachability of Silt by Runoff (g mm<sup>-1</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 1.6

        - name: "DR_s"
          section: "MMF"
          label: "Detachability of Sand by Runoff (g mm<sup>-1</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 1.5

        - name: "manningBare"
          section: "MMF"
          label: "Bare Soil Roughness (s m<sup>1/3</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 0.015

        # - name: "RFR"
        #   section: "MMF"
        #   label: "Tilled Surface Roughness (cm m<sup>-1</sup>)"
        #   type: "scalar"
        #   depends_on: "ErosionFLAG"
        #   default: 5

        - name: "manningTillage"
          section: "MMF"
          label: "Tilled Surface Roughness (s m<sup>1/3</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 0.045

        - name: "PrecInt"
          section: "MMF"
          label: "Intensity of the Erosive Rain (mm h<sup>-1</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 30

        - name: "deltaClay"
          section: "MMF"
          label: "Partical Diameter of Clay (µm)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 2

        - name: "deltaSilt"
          section: "MMF"
          label: "Partical Diameter of Silt (µm)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 50

        - name: "deltaSand"
          section: "MMF"
          label: "Partical Diameter of Sand (µm)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 500

        - name: "deltaGravel"
          section: "MMF"
          label: "Partical Diameter of Gravel (µm)"
          type: "scalar"
          depends_on: 
            - "ErosionFLAG"
            - "MorphodynamicsFLAG"
          default: 4500

        - name: "rho"
          section: "MMF"
          label: "Flow Density (kg m<sup>-3</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 1100

        - name: "rho_s"
          section: "MMF"
          label: "Sediment Density (kg m<sup>-3</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 2650

        - name: "depthBare"
          section: "MMF"
          label: "Flow Depth for Sheet Erosion (m)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 0.005

        - name: "depthInField"
          section: "MMF"
          label: "Flow Depth for Rill Erosion (m)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 0.05

        - name: "eta"
          section: "MMF"
          label: "Fluid Viscosity (kg m<sup>-1</sup> s<sup>-1</sup>)"
          type: "scalar"
          depends_on: "ErosionFLAG"
          default: 0.005

      - name: erosion_musle
        type: group_box
        label: MUSLE
        parameters:      
        - name: "K_USLE"
          section: "MUSLE"
          label: "USLE K-factor Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          depends_on: "ErosionFLAG"
          default: "K_USLE.map"
        
        - name: "P_USLE"
          section: "MUSLE"
          label: "USLE P-factor"
          type: "file_input"
          depends_on: "ErosionFLAG"
          default: "1"

        - name: "musle_table"
          section: "MUSLE"
          label: "MUSLE Table"
          type: "file_input"
          path_style: "relative"
          extension: "*.tbl"
          depends_on: "ErosionFLAG"
          default: "landuse/musle.tbl"

  sediment_transport:
    label: "Sediment Transport"
    parameters:
      - name: sedtrans_module
        type: group_box
        label: Sediment Transport Module
        depends_on: 
          - "RoutFLAG"
          - "ErosionFLAG"
        parameters:
        - name: "SedTransFLAG"
          section: "MODULES"
          label: "Enable Sediment Transport Module"
          type: "flag"
          default: false

      - name: sedtrans_initial
        type: group_box
        label: Initial Conditions
        depends_on: 
          - "SedTransFLAG"
          - "RoutFLAG"
        parameters:
        - name: "Sed_init"
          section: "SEDIMENT_TRANS"
          label: "Initial Routed Sediment Transport (ton day<sup>-1</sup>)"
          type: "scalar"
          depends_on: "SedTransFLAG"
          default: 0

      - name: sediment_transport_simple
        type: group_box
        label: Simple Routing
        help_id: help_sediment_transport_simple
        depends_on: 
          - "SedTransFLAG"
          - "RoutFLAG"
        parameters:      
        - name: "TC_beta"
          section: "SEDIMENT_TRANS"
          label: "Beta Parameter (-)"
          type: "scalar"
          default: 1.4

        - name: "TC_gamma"
          section: "SEDIMENT_TRANS"
          label: "Gamma Parameter (-)"
          type: "scalar"
          default: 1.4

        - name: "depthTC"
          section: "SEDIMENT_TRANS"
          label: "Flow Depth for Transport Capacity (m)"
          type: "scalar"
          default: 0.25

        - name: "manningChannelFLAG"
          section: "SEDIMENT_TRANS"
          label: "Enable Channel Manning's Roughness"
          type: "flag"
          default: false

        - name: "upstream_km2"
          section: "SEDIMENT_TRANS"
          label: "Upstream Area for Definition of Channels (km<sup>2</sup>)"
          type: "scalar"
          default: 25
          depends_on: 
          - "manningChannelFLAG"

        - name: "manningChannel"
          section: "SEDIMENT_TRANS"
          label: "Channel Manning's Roughness (s m<sup>0.5</sup>)"
          type: "scalar"
          default: 0.045
          depends_on: 
          - "manningChannelFLAG"

      - name: sediment_transport_traveltime
        type: group_box
        label: Travel Time Routing
        help_id: help_sediment_transport_traveltime
        depends_on: 
          - "SedTransFLAG"
          - "travelTimeFLAG"
          - "RoutFLAG"
        parameters:      
        - name: "SedTransEquationRills"
          section: "SEDIMENT_TRANS"
          label: "Select Sediment Transport Equation for Rills"
          type: "selection"
          options:
          - label: "Govers (1990)"
            value: 1
          - label: "Abrahams et al. (2001)"
            value: 2
          default: 1

        - name: "omega_cr_Govers"
          section: "SEDIMENT_TRANS"
          label: "Critical Stream Power for Govers (1990) (kg m<sup>-1</sup> s<sup>-1</sup>)"
          type: "scalar"
          default: 0.4

        - name: "Y_cr_Abrahams"
          section: "SEDIMENT_TRANS"
          label: "Critical Shields Parameter for Abrahams et al. (2001) (-)"
          type: "scalar"
          default: 0.06

        - name: "SedTransEquation"
          section: "SEDIMENT_TRANS"
          label: "Select Sediment Transport Equation for Channels"
          type: "selection"
          options:
          - label: "Yalin (1963)"
            value: 1
          - label: "Wong and Parker (2006)"
            value: 2
          - label: "Wilcock and Crowe (2003)"
            value: 3
          default: 1

        - name: "Y_cr_Yalin"
          section: "SEDIMENT_TRANS"
          label: "Critical Shields Parameter for Yalin (1963) (-)"
          type: "scalar"
          default: 0.06

        - name: "tau_c_Wong"
          section: "SEDIMENT_TRANS"
          label: "Effective Critical Shields Parameter for Wong and Parker (2006) (-)"
          type: "scalar"
          default: 0.0495

        - name: "SedConcMax"
          section: "SEDIMENT_TRANS"
          label: "Maximum Allowable Sediment Concentration (g l<sup>-1</sup>)"
          type: "scalar"
          default: 1060

  morphodynamics:
    label: "Morphodynamics"
