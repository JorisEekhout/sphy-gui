          default: false
        
        - name: "vegetationCover"
          section: "CONSERVATION"
          label: "Vegetation Cover Map"
          depends_on: "vegetationCoverFLAG"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "conservation/vegetation_cover.map"

        - name: "vegetationCover_table"
