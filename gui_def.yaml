          extension: "*.map"
          default: "0.5"

        - name: "channelSand"
          section: "MORPHODYNAMICS"
          label: "Percentage of Sand in Channel Bed (-)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "30"

        - name: "channelGravel"
          section: "MORPHODYNAMICS"
          label: "Percentage of Gravel in Channel Bed (-)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "69"

        - name: "layerFraction"
          section: "MORPHODYNAMICS"
          label: "Active Layer Thickness Fraction (-)"
          type: "scalar"
          default: 0.1

  conservation:
