tabs:
  general:
    label: "General"
    parameters:
      - name: folders
        type: group_box
        label: Folders
        parameters:
        - name: "inputdir"
          section: "DIRS"
          label: "Input Folder"
          type: "file_input"
          path_style: "full"
          file_mode: "Directory"
          default: "input/"

        - name: "outputdir"
          section: "DIRS"
          label: "Output Folder"
          type: "file_input"
          path_style: "full"
          file_mode: "Directory"
          default: "output/"
      
      - name: timing
        type: group_box
        label: Dates
        parameters:
        - name: "start_date"
          section: "TIMING"
          label: "Start Date"
          type: "date_input"
          params:
            year_name: "startyear"
            month_name: "startmonth"
            day_name: "startday"
          default: [2024, 1, 1] # [Year, Month, Day]

        - name: "end_date"
          section: "TIMING"
          label: "End Date"
          type: "date_input"
          params:
            year_name: "endyear"
            month_name: "endmonth"
            day_name: "endday"
          default: [2025, 12, 31] # [Year, Month, Day]

        - name: "spinupyears"
          section: "TIMING"
          label: "Spin-up Years"
          type: "integer_input"
          default: 1

      - name: general_maps
        type: group_box
        label: Maps
        parameters:
        - name: "mask"
          section: "GENERAL"
          label: "Clone Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "clone.map"

        - name: "dem"
          section: "GENERAL"
          label: "Digital Elevation Model"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "dem.map"

        - name: "Slope"
          section: "GENERAL"
          label: "Slope Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "slope.map"

        - name: "locations"
          section: "GENERAL"
          label: "Stations Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "stations.map"

        - name: "LandUse"
          section: "LANDUSE"
          label: "Land Use Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "landuse.map"

  reporting:
    label: "Reporting"
    parameters:
        - name: reporting_table
          help_id: help_reporting
          type: group_box
          label: Reporting Table
          parameters:
          - name: "RepTab"
            section: "REPORTING"
            label: "Reporting Table"
            type: "file_input"
            path_style: "relative"
            extension: "*.csv"
            default: "reporting.csv"

        - name: timeseries_reporting
          type: group_box
          label: Time Series in mm
          parameters:
          - name: "mm_rep_FLAG"
            section: "REPORTING"
            label: "Report Time Series in Subcatchments"
            type: "flag"
            default: false

          - name: "QTOT_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Total Runoff Time Series in mm"
            type: "flag"
            default: false

          - name: "QROOTR_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Surface Runoff Time Series in mm"
            type: "flag"
            default: false

          - name: "QROOTD_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Rootzone Runoff Time Series in mm"
            type: "flag"
            default: false

          - name: "QRAIN_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Rain Runoff Time Series in mm"
            type: "flag"
            default: false

          - name: "QSUBSURF_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Subsurface Runoff Time Series in mm"
            type: "flag"
            default: false

          - name: "QBASE_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Base Flow Runoff Time Series in mm"
            type: "flag"
            default: false

          - name: "QSNOW_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Snow Runoff Time Series in mm"
            type: "flag"
            default: false

          - name: "GMelt_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Snow Melt Runoff Time Series in mm"
            type: "flag"
            default: false

          - name: "QGLAC_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Glacier Runoff Time Series in mm"
            type: "flag"
            default: false

          - name: "Prec_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Precipitation Time Series in mm"
            type: "flag"
            default: false

          - name: "ETa_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Actual ET Time Series in mm"
            type: "flag"
            default: false

          - name: "Seep_mm_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Seepage Time Series in mm"
            type: "flag"
            default: false

          - name: "wbal_TSS_FLAG"
            section: "REPORTING"
            depends_on: "mm_rep_FLAG"
            label: "Water Balance Time Series in mm"
            type: "flag"
            default: false

        - name: lake_reservoir_reporting
          type: group_box
          label: Lake and Reservoir
          parameters:
          - name: "Lake_wbal"
            section: "REPORTING"
            depends_on: "LakeFLAG"
            label: "Lake Water Balance Time Series in mm"
            type: "flag"
            default: false

          - name: "Res_wbal"
            section: "REPORTING"
            depends_on: "ResFLAG"
            label: "Reservoir Water Balance Time Series in mm"
            type: "flag"
            default: false

  soil_maps:
    label: "Soil Maps"
    parameters:
      - name: soil_hydraulic_properties
        type: group_box
        help_id: help_soil_hydraulic_properties
        label: Soil Hydraulic Properties
        parameters:
        - name: "RootFieldMap"
          section: "SOIL"
          label: "Field Capacity Rootzone Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "root_field.map"

        - name: "RootSatMap"
          section: "SOIL"
          label: "Saturated Water Content Rootzone Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "root_sat.map"

        - name: "RootDryMap"
          section: "SOIL"
          label: "Permanent Wilting Point Rootzone Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "root_dry.map"

        - name: "RootWiltMap"
          section: "SOIL"
          label: "Wilting Point Rootzone Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "root_wilt.map"

        - name: "RootKsat"
          section: "SOIL"
          label: "Saturated Hydraulic Conductivity Rootzone Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "root_ksat.map"

        - name: "SubFieldMap"
          section: "SOIL"
          label: "Field Capacity Subsoil Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "sub_field.map"

        - name: "SubSatMap"
          section: "SOIL"
          label: "Saturated Water Content Subsoil Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "sub_sat.map"

        - name: "SubKsat"
          section: "SOIL"
          label: "Saturated Hydraulic Conductivity Subsoil Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "sub_ksat.map"

      - name: soil_hydraulic_properties
        type: group_box
        label: Soil Hydraulic Properties
        parameters:
        - name: "PedotransferFLAG"
          section: "PEDOTRANSFER"
          label: "Enable Pedotransfer Utility"
          type: "flag"
          default: false
          controls:
            checked:
              disable: 
                - "RootFieldMap"
                - "RootSatMap"
                - "RootDryMap"
                - "RootWiltMap"
                - "RootKsat"
                - "SubFieldMap"
                - "SubSatMap"
                - "SubKsat"
            unchecked:
              enable: 
                - "RootFieldMap"
                - "RootSatMap"
                - "RootDryMap"
                - "RootWiltMap"
                - "RootKsat"
                - "SubFieldMap"
                - "SubSatMap"
                - "SubKsat"

        - name: "RootSandMap"
          section: "PEDOTRANSFER"
          label: "Sand Rootzone (%)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "root_sand.map"
          depends_on: "PedotransferFLAG"

        - name: "RootClayMap"
          section: "PEDOTRANSFER"
          label: "Clay Rootzone (%)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "root_clay.map"
          depends_on: "PedotransferFLAG"

        - name: "RootOMMap"
          section: "PEDOTRANSFER"
          label: "Organic Matter Rootzone (%)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "root_om.map"
          depends_on: "PedotransferFLAG"

        - name: "RootBulkMap"
          section: "PEDOTRANSFER"
          label: "Bulk Density Rootzone (-)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "root_bd.map"
          depends_on: "PedotransferFLAG"

        - name: "SubSandMap"
          section: "PEDOTRANSFER"
          label: "Sand Subsoil (%)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "sub_sand.map"
          depends_on: "PedotransferFLAG"

        - name: "SubClayMap"
          section: "PEDOTRANSFER"
          label: "Clay Subsoil (%)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "sub_clay.map"
          depends_on: "PedotransferFLAG"

        - name: "SubOMMap"
          section: "PEDOTRANSFER"
          label: "Organic Matter Subsoil (%)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "sub_om.map"
          depends_on: "PedotransferFLAG"

        - name: "SubBulkMap"
          section: "PEDOTRANSFER"
          label: "Bulk Density Subzone (-)"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "sub_bd.map"
          depends_on: "PedotransferFLAG"

  soil_parameters:
    label: "Soil Parameters"
    parameters:
      - name: soil_initial_conditions
        type: group_box
        label: Initial Soil Conditions
        parameters:
        - name: "RootWater"
          section: "SOIL_INIT"
          label: "Initial Rootzone Water Content (mm)"
          type: "scalar"
          default: "50"

        - name: "SubWater"
          section: "SOIL_INIT"
          label: "Initial Subsoil Water Content (mm)"
          type: "scalar"
          default: "10"

        - name: "CapRise"
          section: "SOIL_INIT"
          label: "Initial Capillary Rise (mm)"
          type: "scalar"
          default: "0"

        - name: "RootDrain"
          section: "SOIL_INIT"
          label: "Initial Rootzone Drainage (mm)"
          type: "scalar"
          default: "0"

        - name: "SubDrain"
          section: "SOIL_INIT"
          label: "Initial Subsoil Drainage (mm)"
          type: "scalar"
          default: "0"

      - name: soil_calibration
        type: group_box
        label: Rootzone Calibration Parameters
        parameters:
        - name: "RootFieldFrac"
          section: "SOIL_CAL"
          label: "Multplication Factor Field Capacity (-)"
          type: "scalar"
          default: "1"

        - name: "RootSatFrac"
          section: "SOIL_CAL"
          label: "Multplication Factor Saturated Water Content (-)"
          type: "scalar"
          default: "1"

        - name: "RootDryFrac"
          section: "SOIL_CAL"
          label: "Multplication Factor Permanent Wilting Point (-)"
          type: "scalar"
          default: "1"

        - name: "RootWiltFrac"
          section: "SOIL_CAL"
          label: "Multplication Factor Wilting Point (-)"
          type: "scalar"
          default: "1"

        - name: "RootKsatFrac"
          section: "SOIL_CAL"
          label: "Multplication Factor Saturated Hydraulic Conductivity (-)"
          type: "scalar"
          default: "1"

        - name: "Anisotropy"
          section: "SOIL_CAL"
          label: "Anisotropy (-)"
          type: "scalar"
          default: "1"

      - name: soil_parameters
        type: group_box
        label: Soil Depth Parameters
        parameters:
        - name: "RootDepthFlat"
          section: "SOILPARS"
          label: "Rootzone Depth (mm)"
          type: "scalar"
          default: "500"

        - name: "SubDepthFlat"
          section: "SOILPARS"
          label: "Subsoil Depth (mm)"
          type: "scalar"
          default: "500"

        - name: "CapRiseMax"
          section: "SOILPARS"
          label: "Maximum Allowed Capillary Rise (mm)"
          type: "scalar"
          default: "5"

      - name: infiltration
        type: group_box
        label: Infiltration Parameters
        parameters:
        - name: "Infil_excess"
          section: "INFILTRATION"
          label: "Enable Infiltration Excess Runoff"
          type: "flag"
          default: false
          checked:
            disable: 
              - "PrecInt"
          unchecked:
            enable: 
              - "PrecInt"

        - name: "Alpha"
          section: "INFILTRATION"
          label: "Fraction Daily Rainfall of Most Intense Hour (-)"
          type: "scalar"
          depends_on: "Infil_excess"
          default: 0.25

        - name: "Ksat_frac"
          section: "INFILTRATION"
          label: "Multiplyer for Effective Saturated Hydraulic Conductivity (-)"
          type: "scalar"
          depends_on: "Infil_excess"
          default: 0.5

        - name: "PavedFrac"
          section: "INFILTRATION"
          label: "Fraction of Surface Covered by Pavement (-)"
          type: "file_input"
          depends_on: "Infil_excess"
          path_style: "relative"
          extension: "*.tbl"
          default: "landuse/paved.tbl"

  groundwater:
    label: "Groundwater"
    parameters:
      - name: groundwater_main
        type: group_box
        label: Groundwater Module
        parameters:
        - name: "GroundFLAG"
          section: "MODULES"
          label: "Enable Groundwater Module"
          type: "flag"
          default: false

      - name: groundwater_parameters
        type: group_box
        depends_on: "GroundFLAG"
        label: Groundwater Parameters
        parameters:
        - name: "GwDepth"
          section: "GROUNDW_PARS"
          label: "Groundwater Layer Thickness (mm)"
          type: "scalar"
          default: "2000"

        - name: "GwSat"
          section: "GROUNDW_PARS"
          label: "Saturated Water Content Groundwater (mm)"
          type: "scalar"
          default: "200"

        - name: "deltaGw"
          section: "GROUNDW_PARS"
          label: "Groundwater Recharge Delay Time (days)"
          type: "scalar"
          default: "50"

        - name: "BaseThresh"
          section: "GROUNDW_PARS"
          label: "Baseflow Threshold (mm)"
          type: "scalar"
          default: "0"

        - name: "alphaGw"
          section: "GROUNDW_PARS"
          label: "Baseflow Days (1/days)"
          type: "scalar"
          default: "0.1"

        - name: "YieldGw"
          section: "GROUNDW_PARS"
          label: "Specific Aquifer Yield (m/m)"
          type: "scalar"
          default: "0.05"

      - name: groundwater_seepage_parameters
        type: group_box
        label: Seepage Parameters
        depends_on: "GroundFLAG"
        parameters:
        - name: "SeepStatic"
          section: "SOILPARS"
          label: "Enable Constant Seepage"
          type: "flag"
          # depends_on: "GroundFLAG"
          default: false

        - name: "Seepage"
          section: "SOILPARS"
          label: "Seepage (mm)"
          type: "scalar"
          depends_on: 
            # - "GroundFLAG"
            - "SeepStatic"
          default: ""

        - name: "GWL_base"
          section: "SOILPARS"
          label: "Average Groundwater Level (mm)"
          type: "scalar"
          depends_on: 
            # - "GroundFLAG"
            - "SeepStatic"
          default: ""

      - name: groundwater_initial
        type: group_box
        label: Initial Groundwater Conditions
        depends_on: "GroundFLAG"
        parameters:
        - name: "GwRecharge"
          section: "GROUNDW_INIT"
          label: "Initial Groundwater Recharge (mm)"
          type: "scalar"
          default: "0"

        - name: "BaseR"
          section: "GROUNDW_INIT"
          label: "Initial Baseflow (mm)"
          type: "scalar"
          default: "0"

        - name: "Gw"
          section: "GROUNDW_INIT"
          label: "Initial Groundwater Storage (mm)"
          type: "scalar"
          default: "100"

        - name: "H_gw"
          section: "GROUNDW_INIT"
          label: "Initial Groundwater Table Height (m)"
          type: "scalar"
          default: "2"

  snow:
    label: "Snow"
    parameters:
      - name: snow_main
        type: group_box
        label: Snow Module
        parameters:
        - name: "SnowFLAG"
          section: "MODULES"
          label: "Enable Snow Module"
          type: "flag"
          default: false

      - name: snow_parameters
        type: group_box
        label: Snow Parameters
        depends_on: "SnowFLAG"
        parameters:
        - name: "TCrit"
          section: "SNOW"
          label: "Critical Temperature Snow Temperature (°C)"
          type: "scalar"
          default: "-4"

        - name: "SnowSC"
          section: "SNOW"
          label: "Storage Capacity of Snow Pack (mm/mm)"
          type: "scalar"
          default: "0.5"

        - name: "DDFS"
          section: "SNOW"
          label: "Degree Day Factor for Snow (mm/°C)"
          type: "scalar"
          default: "4"

      - name: snow_initial
        type: group_box
        label: Initial Conditions Snow
        depends_on: "SnowFLAG"
        parameters:
        - name: "SnowIni"
          section: "SNOW_INIT"
          label: "Initial Snow Storage (mm)"
          type: "scalar"
          default: "0"

        - name: "SnowWatStore"
          section: "SNOW_INIT"
          label: "Initial Water Storage Pack (mm)"
          type: "scalar"
          default: "0"

  glacier:
    label: "Glacier"
    parameters:
      - name: glacier_module
        type: group_box
        label: Glacier Module
        parameters:
        - name: "GlacFLAG"
          section: "MODULES"
          label: "Enable Glacier Module"
          type: "flag"
          default: false

      - name: glacier_parameters
        type: group_box
        label: Glacier Parameters
        depends_on: "GlacFLAG"
        parameters:
        - name: "GlacTable"
          section: "GLACIER"
          label: "Glacier Table"
          type: "file_input"
          path_style: "relative"
          extension: "*.tbl"
          default: "glacier.tbl"

        - name: "ModelID"
          section: "GLACIER"
          label: "Model ID Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "model_id.map"

        - name: "GlacID"
          section: "GLACIER"
          label: "Glacier ID Map"
          type: "file_input"
          path_style: "relative"
          extension: "*.map"
          default: "glacier_id.map"

        - name: "DDFG"
          section: "GLACIER"
          label: "Degree Day Factor for Glacier (mm/°C)"
          type: "scalar"
          default: "4"

        - name: "DDFDG"
          section: "GLACIER"
          label: "Degree Day Factor for Glacier Debris (mm/°C)"
          type: "scalar"
          default: "2"

        - name: "GlacF"
          section: "GLACIER"
          label: "Fraction of Glacier Melt to Become Runoff (-)"
          type: "scalar"
          default: "0.548"

        - name: "GlacID_flag"
          section: "GLACIER"
          label: "Enable Reporting per Glacier ID"
          type: "flag"
          default: false

        - name: "GlacVars"
          depends_on: 
            - "GlacFLAG"
            - "GlacID_flag"
          section: "GLACIER"
          label: "Fluxes to Report per Glacier ID"
          type: "text_input"
          default: "FRAC_GLAC,ICE_DEPTH,GLAC_T,Prec_GLAC,Rain_GLAC,Snow_GLAC,ActSnowMelt_GLAC,SnowStore_GLAC,SnowWatStore_GLAC,TotalSnowStore_GLAC,SnowR_GLAC,GlacMelt,GlacR,GlacPerc"

        - name: "GlacRetreat"
          section: "GLACIER"
          label: "Enable Glacier Retreat"
          type: "flag"
          default: true

        - name: "GlacID_memerror"
          section: "GLACIER"
          label: "Enable Memory Error"
          type: "flag"
          default: true

        - name: "GlacUpdate"
          section: "GLACIER"
          label: ""
          type: "composite_input"
          default: "30,9"
          components:
            - name: "day"
              label: "Day for Update of Glacier Fraction"
              type: "text_input"
              default: "30"
              
            - name: "month"
              label: "Month for Update of Glacier Fraction"
              type: "text_input"
              default: "9"

        - name: "TLapse"
          section: "GLACIER"
          label: "Monthly Lapse Rates Table"
          type: "file_input"
          path_style: "relative"
          extension: "*.tbl"
          default: "lapse_rates.tbl"

  vegetation:
    label: "Vegetation"
    parameters:
      - name: crop_coefficients
        type: group_box
        label: Crop Coefficients
        parameters:
        - name: "KCstatic"
          section: "LANDUSE"
          label: "Use Static Crop Coefficients"
          type: "flag"
          default: true
          controls:
            checked:
              disable: 
                - "KC"
            unchecked:
              enable: 
                - "KC"

        - name: "CropFac"
          section: "LANDUSE"
          label: "Crop Coefficient Table"
          type: "file_input"
          path_style: "relative"
          extension: "*.tbl"
          default: "landuse/kc.tbl"
          depends_on: "KCstatic"

        - name: "KC"
          section: "LANDUSE"
          label: "Crop Coefficient Time Series"
          type: "combined_path"
          default: "kc_folder/kc"

      - name: vegetation_module
        type: group_box
        label: Vegetation Module
        help_id: help_vegetation
        parameters:
        - name: "DynVegFLAG"
          section: "MODULES"
          label: "Enable Vegetation Module"
          type: "flag"
          default: false
          controls:
            checked:
              disable: 
                - "CropFac"
                - "KCstatic"
                - "KC"
            unchecked:
              enable: 
                - "CropFac"
                - "KCstatic"

        - name: "NDVI"
          depends_on: "DynVegFLAG"
          section: "DYNVEG"
          label: "NDVI Input File Sample"
          type: "combined_path"
          default: "ndvi_folder/ndvi"

        - name: "NDVImax"
          depends_on: "DynVegFLAG"
          section: "DYNVEG"
          label: "Maximum NDVI (-)"
          type: "scalar"
          default: "0.9"

        - name: "NDVImin"
          depends_on: "DynVegFLAG"
          section: "DYNVEG"
          label: "Minimum NDVI (-)"
          type: "scalar"
          default: "0.05"

        - name: "NDVIbase"
          depends_on: "DynVegFLAG"
          section: "DYNVEG"
          label: "NDVI Value for Missing Data (-)"
          type: "scalar"
          default: "0.15"

        - name: "KCmax"
