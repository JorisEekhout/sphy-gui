        parameters:
        - name: "ETREF_FLAG"
          section: "ETREF"
          label: "Enable Time Series Input for Reference ET"
          type: "flag"
          default: false
          controls:
            checked:
              disable: 
                - "Lat"
                - "Gsc"
                - "Tmin"
                - "Tmax"
            unchecked:
              enable: 
                - "Lat"
                - "Gsc"
                - "Tmin"
                - "Tmax"

        - name: "ETref"
          section: "ETREF"
          label: "Reference Evapotranspiration Input"
          type: "combined_path"
