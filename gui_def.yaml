          path_style: "relative"
          extension: "*.map"
          default: "latitude.map"
        
        - name: "Gsc"
          section: "ETREF"
          label: "Solar Constant"
          type: "scalar"
          default: "0.0820"

      - name: climate_netcdf
        type: group_box
        help_id: help_netcdf
        label: NetCDF Settings
        parameters:
        - name: "NetcdfFLAG"
          section: "NETCDF"
