          label: "Variable Name for X-coordinates"
          type: "text_input"
          depends_on: "NetcdfFLAG"
          default: "rlon"
          
        - name: "y_coord"
          section: "NETCDF"
          label: "Variable Name for Y-coordinates"
          type: "text_input"
          depends_on: "NetcdfFLAG"
          default: "rlat"

        - name: "epsg_netcdf"
          section: "NETCDF"
          label: "EPSG Code NetCDF"
          type: "text_input"
          depends_on: "NetcdfFLAG"
          default: "rotated"
          
        - name: "epsg_model"
          section: "NETCDF"
          label: "EPSG Code Model"
          type: "text_input"
          depends_on: "NetcdfFLAG"
          default: "25830"

        - name: climate_netcdf_prec
          type: group_box
          label: Precipitation
          parameters:
          - name: "precNetcdfFLAG"
            section: "NETCDF"
            label: "Enable Precipitation NetCDF"
            type: "flag"
            depends_on: "NetcdfFLAG"
            default: false
            controls:
              checked:
                disable: 
                  - "Prec"
              unchecked:
                enable: 
                  - "Prec"
          - name: "precNetcdf"
            section: "NETCDF"
            label: "Precipitation NetCDF"
